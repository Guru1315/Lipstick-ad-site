<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Roselle Lip Lab: a turning 3D lipstick twists its bullet up and down through eight shades while rose petals fall">
  <defs>
    <radialGradient id="bg" cx="70%" cy="45%" r="80%">
      <stop offset="0" stop-color="#b01d39"/>
      <stop offset="0.5" stop-color="#8f0b22"/>
      <stop offset="1" stop-color="#4b0613"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd2dc" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#ff9fb6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff9fb6" stop-opacity="0"/>
    </radialGradient>
    <!-- cylinder shading: dark edge, bright band, dark edge -->
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#7a4a2c"/>
      <stop offset="0.22" stop-color="#e9b893"/>
      <stop offset="0.36" stop-color="#fff1e0"/>
      <stop offset="0.55" stop-color="#d6a560"/>
      <stop offset="1" stop-color="#5a321c"/>
    </linearGradient>
    <linearGradient id="case" x1="0" x2="1">
      <stop offset="0" stop-color="#14030a"/>
      <stop offset="0.3" stop-color="#3a0815"/>
      <stop offset="0.42" stop-color="#6b1a2c"/>
      <stop offset="0.6" stop-color="#2c030b"/>
      <stop offset="1" stop-color="#0c0105"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.48" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
    <!-- the bullet steps through the eight shades -->
    <linearGradient id="bullet" x1="0" x2="1">
      <stop offset="0" stop-color="#3a0610"/>
      <stop offset="0.4" stop-color="#e81e43">
        <animate attributeName="stop-color" dur="16s" repeatCount="indefinite" calcMode="discrete"
          values="#e8a3b4;#e0458f;#ff2d8a;#ff5a5f;#e81e43;#b5122c;#6b0f2e;#c2689a"/>
      </stop>
      <stop offset="1" stop-color="#2a0208"/>
    </linearGradient>
    <clipPath id="caseClip"><rect x="790" y="232" width="120" height="100" rx="4"/></clipPath>
    <clipPath id="aboveCollar"><rect x="700" y="20" width="300" height="153"/></clipPath>
    <path id="petal" d="M0 -14 C 10 -10, 12 6, 0 14 C -12 6, -10 -10, 0 -14 Z"/>
  </defs>

  <style>
    .rise { animation: rise 1.4s cubic-bezier(.16,1,.3,1) both; }
    .r2 { animation-delay: .15s } .r3 { animation-delay: .3s } .r4 { animation-delay: .45s } .r5 { animation-delay: .6s }
    @keyframes rise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }

    /* the bullet twists up out of the collar, holds, and twists back down: once per shade */
    .bullet { animation: twist 2s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes twist { 0% { transform: translateY(78px) } 35%, 80% { transform: translateY(0) } 100% { transform: translateY(78px) } }

    /* lettering band slides round the case so it reads as a turning cylinder */
    .band { animation: spin 6s linear infinite; }
    @keyframes spin { from { transform: translateX(0) } to { transform: translateX(-240px) } }

    .cap { transform-box: fill-box; transform-origin: center; animation: capbob 5s ease-in-out infinite; }
    @keyframes capbob { 0%,100% { transform: translate(0,0) rotate(-20deg) } 50% { transform: translate(-6px,-12px) rotate(-14deg) } }

    .float { animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }

    .halo { transform-box: fill-box; transform-origin: center; animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .75; transform: scale(1) } 50% { opacity: 1; transform: scale(1.07) } }

    .petal { fill: #ff7a96; transform-box: fill-box; transform-origin: center; animation: fall 9s linear infinite; }
    .p2 { animation-duration: 11s; animation-delay: -3s; fill: #f43a62 }
    .p3 { animation-duration: 8s; animation-delay: -6s; fill: #ffb6c4 }
    .p4 { animation-duration: 12s; animation-delay: -1.5s }
    .p5 { animation-duration: 10s; animation-delay: -7.5s; fill: #f43a62 }
    .p6 { animation-duration: 13s; animation-delay: -4.5s; fill: #ffb6c4 }
    @keyframes fall {
      0%   { transform: translate(0,-60px) rotate(0deg); opacity: 0 }
      10%  { opacity: .85 }
      50%  { transform: translate(-40px,220px) rotate(200deg) }
      90%  { opacity: .85 }
      100% { transform: translate(10px,480px) rotate(400deg); opacity: 0 }
    }

    /* the shade dots light up in step with the bullet */
    .dot { animation: pick 16s steps(1) infinite; opacity: .35 }
    .d1 { animation-delay: 0s } .d2 { animation-delay: 2s } .d3 { animation-delay: 4s } .d4 { animation-delay: 6s }
    .d5 { animation-delay: 8s } .d6 { animation-delay: 10s } .d7 { animation-delay: 12s } .d8 { animation-delay: 14s }
    @keyframes pick { 0% { opacity: 1 } 12.5%, 100% { opacity: .3 } }

    .ticker { animation: tick 14s linear infinite; }
    @keyframes tick { from { transform: translateX(0) } to { transform: translateX(-600px) } }

    .serif { font-family: 'Bodoni 72', 'Bodoni MT', Didot, 'Playfair Display', Georgia, serif; }
    .mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- falling petals, behind everything -->
  <g opacity="0.9">
    <use href="#petal" class="petal" x="660" y="0"/>
    <use href="#petal" class="petal p2" x="1010" y="0"/>
    <use href="#petal" class="petal p3" x="560" y="0"/>
    <use href="#petal" class="petal p4" x="1120" y="0"/>
    <use href="#petal" class="petal p5" x="760" y="0"/>
    <use href="#petal" class="petal p6" x="960" y="0"/>
  </g>

  <!-- spotlight + pedestal -->
  <ellipse class="halo" cx="850" cy="200" rx="230" ry="190" fill="url(#spot)"/>
  <ellipse cx="850" cy="352" rx="150" ry="24" fill="#2c030b" opacity="0.55"/>
  <ellipse cx="850" cy="346" rx="128" ry="18" fill="#fde8de"/>
  <ellipse cx="850" cy="343" rx="128" ry="18" fill="#f6d2cb"/>
  <rect x="722" y="343" width="256" height="18" fill="#ecbcb6"/>
  <ellipse cx="850" cy="361" rx="128" ry="18" fill="#d9a49c"/>
  <ellipse cx="850" cy="343" rx="128" ry="18" fill="#fff1ec" opacity="0.9"/>

  <g class="float">
    <!-- floating cap -->
    <g class="cap">
      <rect x="640" y="96" width="92" height="124" rx="6" fill="url(#case)"/>
      <rect x="640" y="96" width="92" height="124" rx="6" fill="url(#shine)"/>
      <rect x="640" y="196" width="92" height="12" fill="url(#gold)"/>
      <ellipse cx="686" cy="96" rx="46" ry="9" fill="#4b0613"/>
    </g>

    <!-- bullet: twists up from inside the collar -->
    <g clip-path="url(#aboveCollar)">
      <g class="bullet">
        <path d="M824 176 L824 104 Q 824 88 840 82 L876 64 Q 880 62 880 70 L880 176 Z" fill="url(#bullet)"/>
        <path d="M836 170 L836 96 Q 838 90 846 86" stroke="#fff" stroke-opacity=".45" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- collar -->
    <rect x="814" y="170" width="72" height="66" fill="url(#gold)"/>
    <ellipse cx="850" cy="170" rx="36" ry="7" fill="#5a321c"/>
    <ellipse cx="850" cy="170" rx="30" ry="5" fill="#2a0208"/>
    <rect x="814" y="226" width="72" height="4" fill="#7a4a2c" opacity=".6"/>

    <!-- case body with turning lettering -->
    <rect x="790" y="232" width="120" height="100" rx="4" fill="url(#case)"/>
    <g clip-path="url(#caseClip)">
      <g class="band">
        <text x="780" y="292" class="serif" font-size="22" letter-spacing="6" fill="#e9b893">ROSELLE · ROSELLE · ROSELLE · ROSELLE · ROSELLE ·</text>
      </g>
      <rect x="790" y="250" width="120" height="2" fill="#e9b893" opacity=".7"/>
      <rect x="790" y="306" width="120" height="2" fill="#e9b893" opacity=".7"/>
    </g>
    <rect x="790" y="232" width="120" height="100" rx="4" fill="url(#shine)"/>
    <ellipse cx="850" cy="232" rx="60" ry="9" fill="url(#gold)"/>
    <ellipse cx="850" cy="332" rx="60" ry="9" fill="#14030a"/>
  </g>

  <!-- left: title block -->
  <g class="rise">
    <text x="70" y="86" class="mono" font-size="14" letter-spacing="4" fill="#ffd2dc">BLACK FRIDAY · 30% OFF EVERYTHING</text>
  </g>
  <g class="rise r2">
    <text x="64" y="186" class="serif" font-size="104" font-weight="700" fill="#fde8de" letter-spacing="2">Roselle</text>
  </g>
  <g class="rise r3">
    <text x="70" y="232" class="serif" font-size="34" font-style="italic" fill="#ff9fb6">Lip Lab, in 3D</text>
  </g>
  <g class="rise r4">
    <text x="70" y="272" class="sans" font-size="16" fill="#ffd2dc" opacity=".9">One shared WebGL renderer · 8 shades · a scroll story · all art made in the browser</text>
  </g>

  <!-- shade dots, lit in step with the bullet -->
  <g class="rise r5">
    <circle class="dot d1" cx="80"  cy="312" r="10" fill="#e8a3b4"/>
    <circle class="dot d2" cx="108" cy="312" r="10" fill="#e0458f"/>
    <circle class="dot d3" cx="136" cy="312" r="10" fill="#ff2d8a"/>
    <circle class="dot d4" cx="164" cy="312" r="10" fill="#ff5a5f"/>
    <circle class="dot d5" cx="192" cy="312" r="10" fill="#e81e43"/>
    <circle class="dot d6" cx="220" cy="312" r="10" fill="#b5122c"/>
    <circle class="dot d7" cx="248" cy="312" r="10" fill="#6b0f2e" stroke="#ffb6c4" stroke-width="1"/>
    <circle class="dot d8" cx="276" cy="312" r="10" fill="#c2689a"/>
    <text x="300" y="317" class="mono" font-size="12" letter-spacing="2" fill="#ffd2dc" opacity=".8">8 SHADES</text>
  </g>

  <!-- bottom ticker -->
  <rect x="0" y="372" width="1200" height="28" fill="#2c030b"/>
  <g class="ticker">
    <text x="0" y="391" class="mono" font-size="12" letter-spacing="3" fill="#e9b893">01 THE CASE  ✦  02 THE TWIST  ✦  03 THE FORMULA  ✦  04 THE FINISH  ✦  SWIRL  ✦  01 THE CASE  ✦  02 THE TWIST  ✦  03 THE FORMULA  ✦  04 THE FINISH  ✦  SWIRL  ✦  01 THE CASE  ✦  02 THE TWIST  ✦  03 THE FORMULA  ✦  04 THE FINISH  ✦  SWIRL  ✦</text>
  </g>
</svg>
